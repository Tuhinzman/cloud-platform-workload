# Root pipeline. Services contribute declarative configuration only, and shared behaviour
# lives in ci/templates. Service-local pipeline logic requires a written justification.
#
# checkout populates every stage through publish, because it is the service the first
# digest is built from. The other services stay on lint until they are wired in turn.
# Promotion is a change to the GitOps repository, so nothing fills that stage here.
#
# Secret detection is GitLab's own analyzer rather than the image scanner. It answers a
# different question and is kept a separate control for that reason. Its stage is
# overridden because this pipeline has no test stage.

stages:
  - lint
  - build
  - scan
  - health-test
  - publish
  - promote

include:
  - local: ci/templates/hadolint.yml
  - local: ci/templates/lang-go.yml
  - local: ci/templates/lang-node.yml
  - local: ci/templates/image.yml
  - local: ci/templates/trivy-scan.yml
  - local: ci/templates/ecr-publish.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - local: services/checkout/ci.yml
  - local: services/product-catalog/ci.yml
  - local: services/frontend/ci.yml
  - local: services/payment/ci.yml

secret_detection:
  stage: lint
