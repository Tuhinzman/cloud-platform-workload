# Root pipeline. Services contribute declarative configuration only, and shared behaviour
# lives in ci/templates. Service-local pipeline logic requires a written justification.
#
# checkout populates every stage through publish, because it is the service the first
# digest is built from. shipping and quote follow the same shape, because the workload pair
# they form has to be built and published by this pipeline before it can be exercised.
# frontend-proxy and image-provider follow it too, now that each has a registry repository
# to publish into. Neither carries a lint or test tier: both are configuration-only
# components with no application source, which their own files record. The remaining
# services stay on lint until they are wired in turn.
# Promotion is a change to the GitOps repository, so nothing fills that stage here, but it
# stays downstream of evidence: a published digest is promotion-eligible only once its
# durable provenance bundle exists.
#
# Secret detection is GitLab's own analyzer rather than the image scanner. It answers a
# different question and is kept a separate control for that reason. Its stage is
# overridden because this pipeline has no test stage.

stages:
  - lint
  - build
  - scan
  - health-test
  - publish
  - evidence
  - promote

include:
  - local: ci/templates/hadolint.yml
  - local: ci/templates/lang-go.yml
  - local: ci/templates/lang-node.yml
  - local: ci/templates/lang-rust.yml
  - local: ci/templates/lang-php.yml
  - local: ci/templates/image.yml
  - local: ci/templates/trivy-scan.yml
  - local: ci/templates/ecr-publish.yml
  - local: ci/templates/evidence-retain.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - local: services/checkout/ci.yml
  - local: services/product-catalog/ci.yml
  - local: services/frontend/ci.yml
  - local: services/payment/ci.yml
  - local: services/shipping/ci.yml
  - local: services/quote/ci.yml
  - local: services/frontend-proxy/ci.yml
  - local: services/image-provider/ci.yml

secret_detection:
  stage: lint
