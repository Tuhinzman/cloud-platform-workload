# Services declare configuration only (service-local logic needs a written justification); the
# promote stage stays empty because promotion is a GitOps change, made once evidence exists.

# Only MR and main pipelines: the MR, opened by the push that creates the branch, is the unit
# of review. Branch pipelines would duplicate it, and on a new branch every changes: rule
# matches with no diff base, so the whole fleet fans out.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Secret detection runs in MR pipelines only when this is set.
variables:
  AST_ENABLE_MR_PIPELINES: "true"

stages:
  - lint
  - build
  - scan
  - health-test
  - publish
  - evidence
  - promote

include:
  - local: ci/templates/hadolint.yml
  - local: ci/templates/lang-go.yml
  - local: ci/templates/lang-node.yml
  - local: ci/templates/lang-rust.yml
  - local: ci/templates/lang-php.yml
  - local: ci/templates/lang-dotnet.yml
  - local: ci/templates/lang-cpp.yml
  - local: ci/templates/image.yml
  - local: ci/templates/trivy-scan.yml
  - local: ci/templates/ecr-publish.yml
  - local: ci/templates/evidence-retain.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - local: services/checkout/ci.yml
  - local: services/product-catalog/ci.yml
  - local: services/frontend/ci.yml
  - local: services/payment/ci.yml
  - local: services/shipping/ci.yml
  - local: services/quote/ci.yml
  - local: services/frontend-proxy/ci.yml
  - local: services/image-provider/ci.yml
  - local: services/cart/ci.yml
  - local: services/currency/ci.yml

# GitLab's analyzer, a control separate from the image scanner; moved to lint (no test stage).
secret_detection:
  stage: lint
