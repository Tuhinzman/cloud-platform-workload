# Publishes the scanned image.tar. Only the repository name is set per service; the registry
# host and role ARN are masked project variables because they identify the account.

.ecr-publish-template:
  extends: .docker-dind
  stage: publish
  # No stored AWS credential: the ID token is exchanged for short-lived STS credentials, and
  # aud must equal the value the trust policy pins. Never add environment: here; it changes
  # the OIDC sub claim, which the trust policy matches exactly.
  id_tokens:
    AWS_ID_TOKEN:
      aud: sts.amazonaws.com
  variables:
    AWS_REGION: us-east-1
    SERVICE_SHARED_INPUTS: "${SERVICE_PATH}/**/*"
  before_script:
    - apk add --no-cache aws-cli
  script:
    - |
      creds=$(aws sts assume-role-with-web-identity \
        --role-arn "${AWS_ROLE_ARN}" \
        --role-session-name "gitlab-${CI_PROJECT_ID}-${CI_PIPELINE_ID}" \
        --web-identity-token "${AWS_ID_TOKEN}" \
        --duration-seconds 3600 \
        --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
        --output text)
    # set -- avoids echoing the credential values into the job log.
    - set -- ${creds}
    - export AWS_ACCESS_KEY_ID="$1" AWS_SECRET_ACCESS_KEY="$2" AWS_SESSION_TOKEN="$3"
    - docker load -i image.tar
    - docker tag "${SERVICE_NAME}:${CI_COMMIT_SHORT_SHA}" "${ECR_REGISTRY}/${ECR_REPOSITORY}:${CI_COMMIT_SHORT_SHA}"
    - aws ecr get-login-password --region "${AWS_REGION}" | docker login --username AWS --password-stdin "${ECR_REGISTRY}"
    - docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:${CI_COMMIT_SHORT_SHA}"
    # The registry's own digest from the push. Only the digest is written, since the full
    # reference carries the account.
    - docker inspect --format='{{index .RepoDigests 0}}' "${ECR_REGISTRY}/${ECR_REPOSITORY}:${CI_COMMIT_SHORT_SHA}" | cut -d@ -f2 > digest.txt
    - cat digest.txt
    # Keep the manifest bytes exact (command substitution drops the CLI's newline) so their
    # SHA-256 is the digest; the evidence stage verifies it. A missing digest returns None,
    # not an error, so the returned digest must equal the pushed one.
    - |
      published=$(cat digest.txt)
      fetch() {
        aws ecr batch-get-image \
          --repository-name "${ECR_REPOSITORY}" \
          --image-ids imageDigest="${published}" \
          --accepted-media-types "application/vnd.docker.distribution.manifest.v2+json" "application/vnd.oci.image.manifest.v1+json" \
          --query "$1" \
          --output text
      }
      returned=$(fetch 'images[0].imageId.imageDigest')
      manifest=$(fetch 'images[0].imageManifest')
      if [ "${returned}" != "${published}" ]; then
        echo "ECR returned digest '${returned}' for published digest '${published}'"
        exit 1
      fi
      case "${manifest}" in
        "{"*) ;;
        *) echo "ECR returned no manifest document for ${published}"; exit 1 ;;
      esac
      printf '%s' "${manifest}" > registry-manifest.json
    - date -u +%Y-%m-%dT%H:%M:%SZ > published-at.txt
    - printf '%s\n' "${CI_JOB_ID}" > publish-job-id.txt
  artifacts:
    access: developer
    paths:
      - digest.txt
      - registry-manifest.json
      - published-at.txt
      - publish-job-id.txt
    expire_in: never
  # Manual on purpose: enabling CI must never publish by itself. The changes list mirrors the
  # other artifact-chain templates, and each service's publish job also needs its scans, so
  # GitLab refuses a pipeline that could publish an unscanned image.
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - "${SERVICE_PATH}/**/*"
        - "${SERVICE_SHARED_INPUTS}"
        - "ci/templates/image.yml"
        - "ci/templates/trivy-scan.yml"
        - "ci/templates/ecr-publish.yml"
        - "ci/templates/evidence-retain.yml"
      when: manual
