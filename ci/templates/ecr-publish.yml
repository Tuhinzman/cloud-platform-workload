# Publication to the platform registry.
#
# The job holds no AWS credential. It requests a GitLab ID token, exchanges it for
# short-lived STS credentials, and those expire on their own. The audience is
# sts.amazonaws.com because the applied AWS trust policy pins that exact value.
#
# No environment: keyword here, and that is not a style choice. A job declaring an
# environment gets extra fields in its OIDC sub claim, and the trust policy matches the
# sub string exactly, so the assumption would fail.
#
# The account-bearing registry host and the role ARN arrive as masked project variables.
# Neither belongs in this repository. Only the repository name is written here.
#
# Manual on purpose. Enabling CI/CD must not publish anything by itself, and the first
# digest is a separately authorized step.

.ecr-publish-template:
  extends: .docker-dind
  stage: publish
  id_tokens:
    AWS_ID_TOKEN:
      aud: sts.amazonaws.com
  variables:
    AWS_REGION: us-east-1
  before_script:
    - apk add --no-cache aws-cli
  script:
    - |
      creds=$(aws sts assume-role-with-web-identity \
        --role-arn "${AWS_ROLE_ARN}" \
        --role-session-name "gitlab-${CI_PROJECT_ID}-${CI_PIPELINE_ID}" \
        --web-identity-token "${AWS_ID_TOKEN}" \
        --duration-seconds 3600 \
        --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
        --output text)
    # set -- avoids echoing the credential values into the job log.
    - set -- ${creds}
    - export AWS_ACCESS_KEY_ID="$1" AWS_SECRET_ACCESS_KEY="$2" AWS_SESSION_TOKEN="$3"
    - docker load -i image.tar
    - docker tag "${SERVICE_NAME}:${CI_COMMIT_SHORT_SHA}" "${ECR_REGISTRY}/${ECR_REPOSITORY}:${CI_COMMIT_SHORT_SHA}"
    - aws ecr get-login-password --region "${AWS_REGION}" | docker login --username AWS --password-stdin "${ECR_REGISTRY}"
    - docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:${CI_COMMIT_SHORT_SHA}"
    # RepoDigests carries what the registry returned for the push, so this is the
    # registry's digest and not one computed here. Only the digest is written out,
    # because the full reference carries the account.
    - docker inspect --format='{{index .RepoDigests 0}}' "${ECR_REGISTRY}/${ECR_REPOSITORY}:${CI_COMMIT_SHORT_SHA}" | cut -d@ -f2 > digest.txt
    - cat digest.txt
  artifacts:
    paths:
      - digest.txt
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
