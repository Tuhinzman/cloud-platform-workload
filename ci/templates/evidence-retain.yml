# Job artifacts expire by default, taking the scan and SBOM behind a published digest with them,
# so each publish gets a never-expiring bundle in job artifacts. Those are members-only because
# project-based pipeline visibility is off; the package registry is world-readable here.

.evidence-retain-template:
  stage: evidence
  image: python:3.13-alpine
  variables:
    COMPONENT_CLASS: project-built-application-service
    SERVICE_SHARED_INPUTS: "${SERVICE_PATH}/**/*"
  script:
    - |
      python3 ci/tools/evidence_manifest.py \
        --component "${SERVICE_NAME}" \
        --component-class "${COMPONENT_CLASS}" \
        --source-commit "${CI_COMMIT_SHA}" \
        --pipeline-id "${CI_PIPELINE_ID}" \
        --build-job-id "$(cat build-job-id.txt 2>/dev/null || true)" \
        --scan-job-id "$(cat scan-job-id.txt 2>/dev/null || true)" \
        --publish-job-id "$(cat publish-job-id.txt 2>/dev/null || true)" \
        --evidence-job-id "${CI_JOB_ID}" \
        --trivy trivy-findings.json \
        --sbom sbom.cdx.json \
        --db-metadata trivy-db-metadata.json \
        --registry-manifest registry-manifest.json \
        --digest-file digest.txt \
        --gate-rc-file trivy-gate-rc.txt \
        --publication-timestamp "$(cat published-at.txt)" \
        --out-dir evidence
    # Covers the manifest too, and lists files from the bundle itself, so a file the generator
    # adds can never be missing from a checksum file that still looks complete.
    - |
      bundle="evidence/${SERVICE_NAME}/${CI_COMMIT_SHA}/$(cut -d: -f2 digest.txt)"
      cd "${bundle}"
      ls -1 | grep -v '^SHA256SUMS$' | sort | xargs sha256sum > SHA256SUMS
      sha256sum -c SHA256SUMS
      cd "${CI_PROJECT_DIR}"
  artifacts:
    paths:
      - evidence/
    # No time-based rule knows which digests GitOps still references; removal is an owner action.
    expire_in: never
    when: on_success
  # Promotion-eligible only after this succeeds; on failure the image stays in ECR, ineligible.
  # Via needs, not stage order, so one unplayed publish cannot hold back another service.
  # Publish stays blocking because rules: when: manual defaults allow_failure to false; an
  # optional publish that is never played would silently skip this job.
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - "${SERVICE_PATH}/**/*"
        - "${SERVICE_SHARED_INPUTS}"
        - "ci/templates/image.yml"
        - "ci/templates/trivy-scan.yml"
        - "ci/templates/ecr-publish.yml"
        - "ci/templates/evidence-retain.yml"

# Runs on every tool or CI config change, not only at publication: the graph tests prove
# publish never appears without its scans. `**/*`, not `**`: GitLab's matcher only spans
# directories in the `**/` form.
evidence-tools:test:
  stage: lint
  image: python:3.13-alpine
  # The graph evaluator reads GitLab YAML and the base image ships no parser.
  before_script:
    - pip install --no-cache-dir --quiet pyyaml==6.0.3
  script:
    - python3 -m unittest discover -s ci/tools/tests -v
  rules:
    - changes:
        - "ci/tools/**/*"
        - "ci/templates/**/*"
        - "services/*/ci.yml"
        - ".gitlab-ci.yml"
