# Dockerfile linting. Warnings are logged and only errors gate the pipeline, so that
# advisory findings stay visible without blocking on style.
#
# The linted file is resolved the same way the build resolves it, so a service whose
# container definition is not at the conventional path is linted where it actually lives
# rather than skipped. `**/Dockerfile` matches zero directories as well, so one pattern
# covers both layouts.

.hadolint-template:
  stage: lint
  image: hadolint/hadolint:v2.14.0-alpine
  script:
    - hadolint --failure-threshold=error "${SERVICE_DOCKERFILE:-${SERVICE_PATH}/Dockerfile}"
  rules:
    - changes:
        - "${SERVICE_PATH}/**/Dockerfile"
        - "${SERVICE_PATH}/ci.yml"
        - "ci/templates/hadolint.yml"
