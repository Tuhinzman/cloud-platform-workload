# Image build and container start validation, both on GitLab.com hosted runners.
#
# Docker-in-Docker rather than a mounted host socket. A job holding the daemon socket
# controls every container on that host, which is the pattern this project rejected, and
# the dind service needs no runner of our own.
#
# The dind daemon is started with --mtu=1360, and the number is not a guess. GitLab lowered
# its hosted-runner network MTU to 1360 in May 2026, and the inner Docker daemon creates
# its own bridge at the default 1500 rather than inheriting that, so a build container
# advertises a segment size the path cannot carry. Servers that honour path MTU discovery
# recover; api.nuget.org behind Microsoft Front Door filters the ICMP it would need and
# hangs instead, which is how one package index that never answered ran a cart build to
# the job timeout six times. 1400 was tried first and still hung, since it is above 1360.
# GitLab documents the value and the alternative FF_NETWORK_PER_BUILD; the flag is used
# because it is one line in the one place every build shares.
#
# The build stays local. Nothing reaches the registry before the scan gate has run, so
# the image travels to the later stages as a saved tar artifact rather than a registry
# tag, and a blocked pipeline publishes nothing.
#
# SERVICE_DOCKERFILE defaults to the conventional path and exists for the services that do
# not follow it. cart keeps its container definition at services/cart/src/Dockerfile, where
# upstream put it, and naming the file is cheaper than moving it and losing that lineage.
#
# BUILD_ARGS is expanded unquoted so a service can pass its own --build-arg pairs, the same
# shape HEALTH_ENV already uses below. It is empty for every service today: the Java agent
# version each Java service needs is a default inside its own Dockerfile, so a plain build
# reproduces what CI builds. This exists so a version can be overridden without editing a
# container definition.

.docker-dind:
  image: docker:28-cli
  services:
    - name: docker:28-dind
      command: ["--mtu=1360"]
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"

# A twenty-minute ceiling, one third of GitLab's default. It is a cost bound, not the fix:
# no healthy build here has needed a quarter of it, and a package source that never answers
# would otherwise run to the hour, because NuGet's retry knob was measured not to end a
# restore against a black-holed source inside fifteen minutes at any setting.
.image-build-template:
  extends: .docker-dind
  stage: build
  timeout: 20m
  variables:
    # A service that COPYs a shared directory into its image is not rebuilt by a change to
    # that directory unless it says so, because the rule can only see ${SERVICE_PATH}. The
    # default repeats a path the rule already carries, so declaring nothing changes nothing.
    SERVICE_SHARED_INPUTS: "${SERVICE_PATH}/**/*"
  script:
    - docker build ${BUILD_ARGS} -f "${SERVICE_DOCKERFILE:-${SERVICE_PATH}/Dockerfile}" -t "${SERVICE_NAME}:${CI_COMMIT_SHORT_SHA}" .
    - docker save -o image.tar "${SERVICE_NAME}:${CI_COMMIT_SHORT_SHA}"
    # GitLab tells a job only its own id, so the build records its own for the evidence
    # bundle to pick up; the scan job forwards it rather than pulling image.tar again.
    - printf '%s\n' "${CI_JOB_ID}" > build-job-id.txt
  artifacts:
    paths:
      - image.tar
      - build-job-id.txt
    expire_in: 1 day
  rules:
    - changes:
        - "${SERVICE_PATH}/**/*"
        - "${SERVICE_SHARED_INPUTS}"
        - "ci/templates/image.yml"
        - "ci/templates/trivy-scan.yml"
        - "ci/templates/ecr-publish.yml"
        - "ci/templates/evidence-retain.yml"

# What this proves is bounded: the image starts, stays up, and accepts a connection on
# its port. It is not a functional test, and it deliberately points the service at
# addresses that do not resolve, because the gRPC clients connect lazily and a first
# digest must not require the rest of the fleet to exist.
#
# HEALTH_ENV is expanded unquoted so the service supplies its own required environment
# without every service needing its own job.
#
# HEALTH_MODE=deferred-to-runtime is for a service that cannot reach its listening state
# until a dependency exists. The job then records that measured reason and succeeds at
# recording it; that is not a health pass and never substitutes for runtime readiness.
.image-health-template:
  extends: .docker-dind
  stage: health-test
  variables:
    SERVICE_SHARED_INPUTS: "${SERVICE_PATH}/**/*"
    HEALTH_MODE: validated-in-ci
  script:
    - |
      case "${HEALTH_MODE}" in
        validated-in-ci) ;;
        deferred-to-runtime)
          if [ -z "${HEALTH_REASON}" ]; then
            echo "FAIL: HEALTH_MODE=deferred-to-runtime requires HEALTH_REASON"
            exit 1
          fi
          echo "NOT VALIDATED IN CI: ${HEALTH_REASON}; runtime readiness required"
          exit 0
          ;;
        *)
          echo "FAIL: unknown HEALTH_MODE=${HEALTH_MODE}"
          exit 1
          ;;
      esac
    - docker load -i image.tar
    - docker run -d --name "${SERVICE_NAME}-health" -p "${HEALTH_PORT}:${HEALTH_PORT}" ${HEALTH_ENV} "${SERVICE_NAME}:${CI_COMMIT_SHORT_SHA}"
    - |
      for i in $(seq 1 30); do
        if nc -z docker "${HEALTH_PORT}"; then break; fi
        sleep 1
      done
    - nc -z docker "${HEALTH_PORT}"
    - test "$(docker inspect -f '{{.State.Running}}' "${SERVICE_NAME}-health")" = "true"
    - docker logs "${SERVICE_NAME}-health"
  after_script:
    - docker rm -f "${SERVICE_NAME}-health" || true
  rules:
    - changes: ["${SERVICE_PATH}/**/*", "${SERVICE_SHARED_INPUTS}", "ci/templates/image.yml"]
