# Docker-in-Docker, not a mounted host socket: a job holding the host socket controls every
# container on the runner.

.docker-dind:
  image: docker:28-cli
  services:
    - name: docker:28-dind
      # Matches GitLab's hosted-runner MTU. The inner bridge would use 1500, and api.nuget.org
      # filters the ICMP path-MTU discovery needs, so restores hang; 1400 hangs as well.
      command: ["--mtu=1360"]
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"

# Builds locally and passes image.tar on, so nothing reaches the registry before the scan gate.
# SERVICE_DOCKERFILE overrides the default path (cart keeps upstream's src/Dockerfile). BUILD_ARGS
# (unquoted --build-arg pairs) stays empty: versions are Dockerfile ARG defaults, so a plain build
# matches CI.
.image-build-template:
  extends: .docker-dind
  stage: build
  # A cost ceiling well above any healthy build, not a fix: NuGet retries cannot end a restore
  # against an unresponsive source, so the job would otherwise run to the hour.
  timeout: 20m
  variables:
    # Set by a service that COPYs a shared directory, since the rules only watch
    # ${SERVICE_PATH}; the default adds nothing.
    SERVICE_SHARED_INPUTS: "${SERVICE_PATH}/**/*"
  script:
    - docker build ${BUILD_ARGS} -f "${SERVICE_DOCKERFILE:-${SERVICE_PATH}/Dockerfile}" -t "${SERVICE_NAME}:${CI_COMMIT_SHORT_SHA}" .
    - docker save -o image.tar "${SERVICE_NAME}:${CI_COMMIT_SHORT_SHA}"
    # A job only knows its own id, so the build records it; the scan forwards the file so the
    # evidence job never depends on the build or its image.tar.
    - printf '%s\n' "${CI_JOB_ID}" > build-job-id.txt
  artifacts:
    paths:
      - image.tar
      - build-job-id.txt
    expire_in: 1 day
  rules:
    - changes:
        - "${SERVICE_PATH}/**/*"
        - "${SERVICE_SHARED_INPUTS}"
        - "ci/templates/image.yml"
        - "ci/templates/trivy-scan.yml"
        - "ci/templates/ecr-publish.yml"
        - "ci/templates/evidence-retain.yml"

# Proves only that the image starts, stays up and accepts a connection on its port. Dependency
# addresses deliberately do not resolve so no other service is needed (gRPC connects lazily).
# HEALTH_ENV is unquoted so each service supplies its own environment. deferred-to-runtime
# records a measured reason and succeeds without validating health; runtime readiness is owed.
# A service that cannot listen until a startup dependency answers names a digest-pinned fixture:
# it runs beside the service on a job-private network and is never runtime evidence. running is
# for a worker that never listens: it proves the process stays up, not that it works.
.image-health-template:
  extends: .docker-dind
  stage: health-test
  variables:
    SERVICE_SHARED_INPUTS: "${SERVICE_PATH}/**/*"
    HEALTH_MODE: validated-in-ci
    HEALTH_DEPENDENCY_IMAGE: ""
    HEALTH_DEPENDENCY_ENV: ""
    HEALTH_DEPENDENCY_READY: ""
    HEALTH_RUNNING_SECONDS: "30"
    # Runs the job's own negative controls: a container that listens on nothing, and one that exits.
    HEALTH_CONTROL_IMAGE: alpine:3.21@sha256:ce64758a109eb420d874a118f87920e625e12d3634e03b4a5573fd9f6e5d3507
  script:
    - |
      case "${HEALTH_MODE}" in
        validated-in-ci|running) ;;
        deferred-to-runtime)
          if [ -z "${HEALTH_REASON}" ]; then
            echo "FAIL: HEALTH_MODE=deferred-to-runtime requires HEALTH_REASON"
            exit 1
          fi
          echo "NOT VALIDATED IN CI: ${HEALTH_REASON}; runtime readiness required"
          exit 0
          ;;
        *)
          echo "FAIL: unknown HEALTH_MODE=${HEALTH_MODE}"
          exit 1
          ;;
      esac
    - docker load -i image.tar
    # A sibling in the DinD daemon, not a GitLab services: entry, which nested containers cannot
    # resolve. A tag or an unreadiness would make the fixture, not the image, the thing tested.
    - |
      if [ -n "${HEALTH_DEPENDENCY_IMAGE}" ]; then
        if ! echo "${HEALTH_DEPENDENCY_IMAGE}" | grep -Eq '@sha256:[0-9a-f]{64}$'; then
          echo "FAIL: HEALTH_DEPENDENCY_IMAGE must be pinned by digest"
          exit 1
        fi
        if [ -z "${HEALTH_DEPENDENCY_READY}" ]; then
          echo "FAIL: HEALTH_DEPENDENCY_IMAGE requires HEALTH_DEPENDENCY_READY"
          exit 1
        fi
        docker network create health-net
        docker run -d --name health-dependency --network health-net ${HEALTH_DEPENDENCY_ENV} "${HEALTH_DEPENDENCY_IMAGE}"
        for i in $(seq 1 60); do
          if docker exec health-dependency sh -c "${HEALTH_DEPENDENCY_READY}" >/dev/null 2>&1; then break; fi
          sleep 1
        done
        if ! docker exec health-dependency sh -c "${HEALTH_DEPENDENCY_READY}" >/dev/null 2>&1; then
          docker logs health-dependency
          echo "FAIL: the health dependency did not become ready"
          exit 1
        fi
      fi
    # Both run under --init: as PID 1 a process that aborts, as .NET does on an unhandled exception,
    # is left running. The control aborts itself; if it still reads as running, so could a crash.
    - |
      if [ "${HEALTH_MODE}" = running ]; then
        docker run -d --init --name "${SERVICE_NAME}-health" ${HEALTH_DEPENDENCY_IMAGE:+--network health-net} ${HEALTH_ENV} "${SERVICE_NAME}:${CI_COMMIT_SHORT_SHA}"
        docker run -d --init --name health-exit-control "${HEALTH_CONTROL_IMAGE}" sh -c 'kill -ABRT $$; sleep 600'
        sleep "${HEALTH_RUNNING_SECONDS}"
        if [ "$(docker inspect -f '{{.State.Running}}' health-exit-control)" != "false" ]; then
          echo "FAIL: the aborted control still reads as running, so this check cannot tell"
          exit 1
        fi
        docker logs "${SERVICE_NAME}-health"
        if [ "$(docker inspect -f '{{.State.Running}} {{.RestartCount}}' "${SERVICE_NAME}-health")" != "true 0" ]; then
          echo "FAIL: ${SERVICE_NAME} did not stay running for ${HEALTH_RUNNING_SECONDS} s"
          exit 1
        fi
        echo "RUNNING, NOT FUNCTIONAL HEALTH: ${SERVICE_NAME} stayed up ${HEALTH_RUNNING_SECONDS} s; no port was probed"
        exit 0
      fi
    # The probe must first read a container that listens on nothing, on the same port, as closed;
    # where a proxy answers for published ports, nc -z would pass anything.
    - |
      docker run -d --name health-probe-control -p "${HEALTH_PORT}:${HEALTH_PORT}" "${HEALTH_CONTROL_IMAGE}" sleep 60
      sleep 2
      if nc -z -w 3 docker "${HEALTH_PORT}"; then
        echo "FAIL: the probe reached a port nothing listens on, so it cannot prove listening here"
        exit 1
      fi
      docker rm -f health-probe-control
    - docker run -d --name "${SERVICE_NAME}-health" ${HEALTH_DEPENDENCY_IMAGE:+--network health-net} -p "${HEALTH_PORT}:${HEALTH_PORT}" ${HEALTH_ENV} "${SERVICE_NAME}:${CI_COMMIT_SHORT_SHA}"
    - |
      for i in $(seq 1 30); do
        if nc -z docker "${HEALTH_PORT}"; then break; fi
        sleep 1
      done
    - nc -z docker "${HEALTH_PORT}"
    - test "$(docker inspect -f '{{.State.Running}}' "${SERVICE_NAME}-health")" = "true"
    - docker logs "${SERVICE_NAME}-health"
  after_script:
    - docker rm -f "${SERVICE_NAME}-health" health-dependency health-probe-control health-exit-control || true
    - docker network rm health-net || true
  rules:
    - changes: ["${SERVICE_PATH}/**/*", "${SERVICE_SHARED_INPUTS}", "ci/templates/image.yml"]

# For services that publish. publish needs this job and GitLab refuses a pipeline that lacks a
# needed job, so on main it follows publish onto the publish chain's own templates as well.
.image-health-publisher-template:
  extends: .image-health-template
  rules:
    - changes: ["${SERVICE_PATH}/**/*", "${SERVICE_SHARED_INPUTS}", "ci/templates/image.yml"]
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - "ci/templates/trivy-scan.yml"
        - "ci/templates/ecr-publish.yml"
        - "ci/templates/evidence-retain.yml"
