# Docker-in-Docker, not a mounted host socket: a job holding the host socket controls every
# container on the runner.

.docker-dind:
  image: docker:28-cli
  services:
    - name: docker:28-dind
      # Matches GitLab's hosted-runner MTU. The inner bridge would use 1500, and api.nuget.org
      # filters the ICMP path-MTU discovery needs, so restores hang; 1400 hangs as well.
      command: ["--mtu=1360"]
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"

# Builds locally and passes image.tar on, so nothing reaches the registry before the scan gate.
# SERVICE_DOCKERFILE overrides the default path (cart keeps upstream's src/Dockerfile). BUILD_ARGS
# (unquoted --build-arg pairs) stays empty: versions are Dockerfile ARG defaults, so a plain build
# matches CI.
.image-build-template:
  extends: .docker-dind
  stage: build
  # A cost ceiling well above any healthy build, not a fix: NuGet retries cannot end a restore
  # against an unresponsive source, so the job would otherwise run to the hour.
  timeout: 20m
  variables:
    # Set by a service that COPYs a shared directory, since the rules only watch
    # ${SERVICE_PATH}; the default adds nothing.
    SERVICE_SHARED_INPUTS: "${SERVICE_PATH}/**/*"
  script:
    - docker build ${BUILD_ARGS} -f "${SERVICE_DOCKERFILE:-${SERVICE_PATH}/Dockerfile}" -t "${SERVICE_NAME}:${CI_COMMIT_SHORT_SHA}" .
    - docker save -o image.tar "${SERVICE_NAME}:${CI_COMMIT_SHORT_SHA}"
    # A job only knows its own id, so the build records it; the scan forwards the file so the
    # evidence job never depends on the build or its image.tar.
    - printf '%s\n' "${CI_JOB_ID}" > build-job-id.txt
  artifacts:
    paths:
      - image.tar
      - build-job-id.txt
    expire_in: 1 day
  rules:
    - changes:
        - "${SERVICE_PATH}/**/*"
        - "${SERVICE_SHARED_INPUTS}"
        - "ci/templates/image.yml"
        - "ci/templates/trivy-scan.yml"
        - "ci/templates/ecr-publish.yml"
        - "ci/templates/evidence-retain.yml"

# Proves only that the image starts, stays up and accepts a connection on its port. Dependency
# addresses deliberately do not resolve so no other service is needed (gRPC connects lazily).
# HEALTH_ENV is unquoted so each service supplies its own environment. deferred-to-runtime
# records a measured reason and succeeds without validating health; runtime readiness is owed.
.image-health-template:
  extends: .docker-dind
  stage: health-test
  variables:
    SERVICE_SHARED_INPUTS: "${SERVICE_PATH}/**/*"
    HEALTH_MODE: validated-in-ci
  script:
    - |
      case "${HEALTH_MODE}" in
        validated-in-ci) ;;
        deferred-to-runtime)
          if [ -z "${HEALTH_REASON}" ]; then
            echo "FAIL: HEALTH_MODE=deferred-to-runtime requires HEALTH_REASON"
            exit 1
          fi
          echo "NOT VALIDATED IN CI: ${HEALTH_REASON}; runtime readiness required"
          exit 0
          ;;
        *)
          echo "FAIL: unknown HEALTH_MODE=${HEALTH_MODE}"
          exit 1
          ;;
      esac
    - docker load -i image.tar
    - docker run -d --name "${SERVICE_NAME}-health" -p "${HEALTH_PORT}:${HEALTH_PORT}" ${HEALTH_ENV} "${SERVICE_NAME}:${CI_COMMIT_SHORT_SHA}"
    - |
      for i in $(seq 1 30); do
        if nc -z docker "${HEALTH_PORT}"; then break; fi
        sleep 1
      done
    - nc -z docker "${HEALTH_PORT}"
    - test "$(docker inspect -f '{{.State.Running}}' "${SERVICE_NAME}-health")" = "true"
    - docker logs "${SERVICE_NAME}-health"
  after_script:
    - docker rm -f "${SERVICE_NAME}-health" || true
  rules:
    - changes: ["${SERVICE_PATH}/**/*", "${SERVICE_SHARED_INPUTS}", "ci/templates/image.yml"]
