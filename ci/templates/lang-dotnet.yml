# The SDK image matches the Dockerfile's builder, but this is a glibc build while the image
# publishes for linux-musl: this job gates source and analyzers, and only the image build
# checks musl. The SDK's Roslyn analyzers are the linter; there is no formatter gate.
# Known limit: cart sets SelfContained without a RID, so its lock records linux-x64 and an arm64
# host fails NU1004. The lock is bound to the x64 runners; that error is not drift.

.lang-dotnet-template:
  stage: lint
  variables:
    SERVICE_SHARED_INPUTS: "${SERVICE_PATH}/**/*"
  image: mcr.microsoft.com/dotnet/sdk:10.0
  script:
    - cd "${SERVICE_PATH}"
    - dotnet --version
    # --locked-mode fails with NU1004 on drift, so the lock the source gate scans is what this
    # job builds (the image's musl restore is unlocked). With no lock file it passes; the source
    # gate's zero-package check catches that.
    - dotnet restore --locked-mode
    # Release, where the analyzers gate. --no-restore: under TreatWarningsAsErrors any Release
    # restore turns NuGetAudit advisories into errors. They are logged, not gated, here; whether
    # they should block is an open decision.
    - dotnet build --no-restore -c Release
  rules:
    - changes: ["${SERVICE_PATH}/**/*", "${SERVICE_SHARED_INPUTS}", "ci/templates/lang-dotnet.yml"]

# Separate from the lint template so a service opts in only where tests actually exist.
# Extending it from a service with no test files would report a passing test job that
# asserted nothing.
# No -c Release, so audit advisories cannot fail a test job.
.lang-dotnet-test-template:
  stage: lint
  variables:
    SERVICE_SHARED_INPUTS: "${SERVICE_PATH}/**/*"
  image: mcr.microsoft.com/dotnet/sdk:10.0
  script:
    - cd "${SERVICE_PATH}"
    - dotnet test
  rules:
    - changes: ["${SERVICE_PATH}/**/*", "${SERVICE_SHARED_INPUTS}", "ci/templates/lang-dotnet.yml"]
