# Go static validation. The Go toolchain image is used rather than a golangci-lint image,
# because those images do not ship the go binary the compile check needs.

.lang-go-template:
  stage: lint
  variables:
    SERVICE_SHARED_INPUTS: "${SERVICE_PATH}/**/*"
  image: golang:1.26.9-bookworm@sha256:d9c68c2c51161e12fd77e4c6320687c9cd86e1af1e3ad6e6cd63ff970641453c
  script:
    - cd "${SERVICE_PATH}"
    - go version
    - go mod download
    - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.7.2
    - /go/bin/golangci-lint run ./...
    - go build ./...
  rules:
    - changes: ["${SERVICE_PATH}/**/*", "${SERVICE_SHARED_INPUTS}", "ci/templates/lang-go.yml"]

# Separate from the lint template so a service opts in only where tests actually exist.
# Extending it from a service with no test files would report a passing test job that
# asserted nothing.
.lang-go-test-template:
  stage: lint
  variables:
    SERVICE_SHARED_INPUTS: "${SERVICE_PATH}/**/*"
  image: golang:1.26.9-bookworm@sha256:d9c68c2c51161e12fd77e4c6320687c9cd86e1af1e3ad6e6cd63ff970641453c
  script:
    - cd "${SERVICE_PATH}"
    - go test ./...
  rules:
    - changes: ["${SERVICE_PATH}/**/*", "${SERVICE_SHARED_INPUTS}", "ci/templates/lang-go.yml"]
