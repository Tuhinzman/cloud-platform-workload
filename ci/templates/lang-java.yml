# Each template runs the builder image and Gradle its services' Dockerfiles use, so no new image is
# trusted. One image cannot serve both: measured, on JDK 21 fraud-detection fails Kotlin's
# JVM-target check. Neither service ships test sources, so there is no test template.
# Strict locking fails any resolution that differs from gradle.lockfile. Each job runs its
# Dockerfile's task: measured, classes alone passed a runtime-only dependency missing from the lock.

# No formatter step: ad's declared google-java-format 1.18.1 cannot gate. Its plugin reported every
# file as a syntax error, and run directly it would reformat all four unmodified upstream files.
.lang-java-template:
  stage: lint
  variables:
    SERVICE_SHARED_INPUTS: "${SERVICE_PATH}/**/*"
  image: eclipse-temurin:21-jdk
  script:
    - cd "${SERVICE_PATH}"
    - ./gradlew --version
    - ./gradlew installDist
  rules:
    - changes: ["${SERVICE_PATH}/**/*", "${SERVICE_SHARED_INPUTS}", "ci/templates/lang-java.yml"]

# The image's own Gradle, not the committed wrapper, because that is what the image build runs.
# PROTO_DIR is where the Dockerfile copies pb/; without the copy no stubs are generated and the
# sources do not resolve.
.lang-java-gradle-template:
  stage: lint
  variables:
    SERVICE_SHARED_INPUTS: "${SERVICE_PATH}/**/*"
  image: gradle:8-jdk17
  script:
    - mkdir -p "${SERVICE_PATH}/${PROTO_DIR:?}"
    - cp -R pb/. "${SERVICE_PATH}/${PROTO_DIR}/"
    - cd "${SERVICE_PATH}"
    - gradle --version
    - gradle shadowJar
  rules:
    - changes: ["${SERVICE_PATH}/**/*", "${SERVICE_SHARED_INPUTS}", "ci/templates/lang-java.yml"]
