# Each service extends only the template matching the validation tooling it declares.
# npx --no runs only binaries the lock-pinned npm ci tree provides; without it a missing
# package is fetched at a version no lock file pins.

.lang-node-template:
  stage: lint
  variables:
    SERVICE_SHARED_INPUTS: "${SERVICE_PATH}/**/*"
  image: node:22-alpine
  script:
    - cd "${SERVICE_PATH}"
    - npm ci --no-audit --no-fund
    - npx --no eslint .
    - npx --no tsc --noEmit
  rules:
    - changes: ["${SERVICE_PATH}/**/*", "${SERVICE_SHARED_INPUTS}", "ci/templates/lang-node.yml"]

# For a service with no static-analysis tooling of its own; a linter added here would be a
# control the service does not own. node --check parses without resolving require, so no
# install is needed. -n1 because node --check checks only the first file it is given. The
# list is written and tested rather than piped, so an empty one fails instead of passing.

.lang-node-parse-template:
  stage: lint
  variables:
    SERVICE_SHARED_INPUTS: "${SERVICE_PATH}/**/*"
  image: node:22-alpine
  script:
    - cd "${SERVICE_PATH}"
    - find . -name '*.js' -print0 > /tmp/js-files
    - test -s /tmp/js-files
    - xargs -0 -n1 node --check < /tmp/js-files
  rules:
    - changes: ["${SERVICE_PATH}/**/*", "${SERVICE_SHARED_INPUTS}", "ci/templates/lang-node.yml"]
