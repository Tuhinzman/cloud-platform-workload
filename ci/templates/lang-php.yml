# The Composer image the service Dockerfile's vendor stage already pins, so no new image is
# trusted; it carries both PHP and Composer. No linter, analyser or test runner: the service
# declares no require-dev, and a tool installed here would be a control it does not own.
#
# php -l is the interpreter's parse step; -n1 because it checks only the first file given.
# vendor/ is third-party code, covered by the scan stage rather than gated here.
#
# Keep composer validate's lock check (no --no-check-lock): the source gate scans
# composer.lock and the vendor stage installs from it, so manifest/lock drift would mean
# scanning one set and shipping another. validate exits non-zero on that drift; composer
# install, measured on this pinned image, only warns. --no-check-publish skips packagist
# rules that do not apply to an unpublished service.

.lang-php-template:
  stage: lint
  variables:
    SERVICE_SHARED_INPUTS: "${SERVICE_PATH}/**/*"
  image: composer:2.8.12
  script:
    - cd "${SERVICE_PATH}"
    - php -v
    - composer validate --no-check-publish
    - find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
  rules:
    - changes: ["${SERVICE_PATH}/**/*", "${SERVICE_SHARED_INPUTS}", "ci/templates/lang-php.yml"]
