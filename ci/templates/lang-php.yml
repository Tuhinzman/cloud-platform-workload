# The Composer image the vendor stage already pins, so no new image is trusted. No linter or
# test runner: the service declares no require-dev to provide one.

.lang-php-template:
  stage: lint
  variables:
    SERVICE_SHARED_INPUTS: "${SERVICE_PATH}/**/*"
  image: composer:2.8.12
  script:
    - cd "${SERVICE_PATH}"
    - php -v
    # Lock check kept: the scan and the vendor stage both read composer.lock and composer install
    # only warns on drift, so this stops composer.json declaring a set nobody scanned or shipped.
    # --no-check-publish: the service is not a published package.
    - composer validate --no-check-publish
    # -n1 runs one php -l invocation per file; vendor/ is left to dependency scanning.
    - find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
  rules:
    - changes: ["${SERVICE_PATH}/**/*", "${SERVICE_SHARED_INPUTS}", "ci/templates/lang-php.yml"]
