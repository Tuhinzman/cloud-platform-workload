# The toolchain image matches the service Dockerfile's builder stage, so a lint pass
# predicts a build pass. The image's minimal rustup profile omits clippy, hence the explicit
# add. No formatter gate: no other tier runs one.
#
# --locked refuses to update Cargo.lock, so a dependency cannot move between the lint job
# and the image build.

.lang-rust-template:
  stage: lint
  variables:
    SERVICE_SHARED_INPUTS: "${SERVICE_PATH}/**/*"
  image: rust:1.91
  script:
    - cd "${SERVICE_PATH}"
    - cargo --version
    - rustup component add clippy
    - cargo clippy --locked --all-targets -- -D warnings
    - cargo build --locked
  rules:
    - changes: ["${SERVICE_PATH}/**/*", "${SERVICE_SHARED_INPUTS}", "ci/templates/lang-rust.yml"]

# Separate from the lint template so a service opts in only where tests actually exist.
# Extending it from a service with no test files would report a passing test job that
# asserted nothing.
.lang-rust-test-template:
  stage: lint
  variables:
    SERVICE_SHARED_INPUTS: "${SERVICE_PATH}/**/*"
  image: rust:1.91
  script:
    - cd "${SERVICE_PATH}"
    - cargo test --locked
  rules:
    - changes: ["${SERVICE_PATH}/**/*", "${SERVICE_SHARED_INPUTS}", "ci/templates/lang-rust.yml"]
