# The toolchain matches the Dockerfile's builder, so a lint pass predicts a build pass. The
# image's minimal rustup profile omits clippy. --locked fails on a stale Cargo.lock, so the
# unlocked image build resolves the same versions this job checked.

.lang-rust-template:
  stage: lint
  variables:
    SERVICE_SHARED_INPUTS: "${SERVICE_PATH}/**/*"
  image: rust:1.91
  script:
    - cd "${SERVICE_PATH}"
    - cargo --version
    - rustup component add clippy
    - cargo clippy --locked --all-targets -- -D warnings
    - cargo build --locked
  rules:
    - changes: ["${SERVICE_PATH}/**/*", "${SERVICE_SHARED_INPUTS}", "ci/templates/lang-rust.yml"]

# Separate from the lint template so a service opts in only where tests actually exist.
# Extending it from a service with no test files would report a passing test job that
# asserted nothing.
.lang-rust-test-template:
  stage: lint
  variables:
    SERVICE_SHARED_INPUTS: "${SERVICE_PATH}/**/*"
  image: rust:1.91
  script:
    - cd "${SERVICE_PATH}"
    - cargo test --locked
  rules:
    - changes: ["${SERVICE_PATH}/**/*", "${SERVICE_SHARED_INPUTS}", "ci/templates/lang-rust.yml"]
