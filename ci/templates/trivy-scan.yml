# Container image scanning in two passes, and the order is the point.
#
# Pass one never fails the job and always writes its findings as an artifact. Pass two
# applies the gate. Running them in this order means a blocked pipeline still leaves
# triage evidence behind, which a gate-only pipeline does not.
#
# The scanner image is pinned by digest so a tag move cannot change what ran. The database
# cache key carries the scanner version, so a version bump invalidates the cache instead
# of silently reusing an old database.
#
# The scan reads the tar the build stage saved rather than a registry tag. Scanning a
# published image would mean publishing before the gate, which is the opposite of what
# the gate exists for. The SBOM is written between the two passes, so it survives a
# pipeline the gate blocks.
#
# Two things are captured that the reports themselves do not carry. The vulnerability
# database metadata is read straight after the first pass, so it describes the database
# that pass actually used, and reading it neither updates the database nor changes the
# result. The blocking pass records its own exit status, because the gate result was
# previously only derivable from the fact that the informational findings were empty, and
# an observed status is evidence where a derivation is an argument.
#
# The evidence artifacts do not expire. What they support - the provenance of a published
# digest - has no expiry either, and a 30 day window has already cost this project one
# service's raw scan history.

.trivy-scan-template:
  stage: scan
  image:
    name: aquasec/trivy:0.70.0@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e
    entrypoint: [""]
  variables:
    TRIVY_CACHE_DIR: .trivycache
    TRIVY_NO_PROGRESS: "true"
  cache:
    key: trivy-db-0.70.0
    paths:
      - .trivycache/
  before_script:
    - mkdir -p .trivycache
    - touch .trivy-combined-ignore.txt
    - if [ -f "${SERVICE_PATH}/.trivyignore" ]; then cat "${SERVICE_PATH}/.trivyignore" >> .trivy-combined-ignore.txt; fi
  script:
    - |
      trivy image \
        --severity HIGH,CRITICAL \
        --format json \
        --output trivy-findings.json \
        --exit-code 0 \
        --input image.tar
    - trivy version --format json > trivy-db-metadata.json || true
    - |
      trivy image \
        --format cyclonedx \
        --output sbom.cdx.json \
        --input image.tar
    - printf '%s\n' "${CI_JOB_ID}" > scan-job-id.txt
    # The gate itself is unchanged. Only its exit status is recorded before the job carries
    # that same status forward, so nothing about what blocks a pipeline moves here.
    - |
      set +e
      trivy image \
        --severity HIGH,CRITICAL \
        --ignore-unfixed \
        --ignorefile .trivy-combined-ignore.txt \
        --exit-code 1 \
        --input image.tar
      gate_rc=$?
      set -e
      printf '%s\n' "${gate_rc}" > trivy-gate-rc.txt
      exit "${gate_rc}"
  artifacts:
    paths:
      - trivy-findings.json
      - sbom.cdx.json
      - trivy-db-metadata.json
      - trivy-gate-rc.txt
      - scan-job-id.txt
      - build-job-id.txt
    expire_in: never
    when: always
  rules:
    - changes: ["${SERVICE_PATH}/**/*", "ci/templates/**", ".gitlab-ci.yml"]
