# Container image scanning in two passes, and the order is the point.
#
# Pass one never fails the job and always writes its findings as an artifact. Pass two
# applies the gate. Running them in this order means a blocked pipeline still leaves
# triage evidence behind, which a gate-only pipeline does not.
#
# The scanner image is pinned by digest so a tag move cannot change what ran. The database
# cache key carries the scanner version, so a version bump invalidates the cache instead
# of silently reusing an old database.
#
# The scan reads the tar the build stage saved rather than a registry tag. Scanning a
# published image would mean publishing before the gate, which is the opposite of what
# the gate exists for. The SBOM is written between the two passes, so it survives a
# pipeline the gate blocks.
#
# Two things are captured that the reports themselves do not carry. The vulnerability
# database metadata is read straight after the first pass, so it describes the database
# that pass actually used, and reading it neither updates the database nor changes the
# result. The blocking pass records its own exit status, so the gate result is observed
# rather than derived from the findings.
#
# The evidence artifacts do not expire. What they support - the provenance of a published
# digest - has no expiry either, and a 30 day window has already cost this project one
# service's raw scan history.

.trivy-scan-template:
  stage: scan
  image:
    name: aquasec/trivy:0.70.0@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e
    entrypoint: [""]
  variables:
    TRIVY_CACHE_DIR: .trivycache
    TRIVY_NO_PROGRESS: "true"
    SERVICE_SHARED_INPUTS: "${SERVICE_PATH}/**/*"
  cache:
    key: trivy-db-0.70.0
    paths:
      - .trivycache/
  before_script:
    - mkdir -p .trivycache
    - touch .trivy-combined-ignore.txt
    - if [ -f "${SERVICE_PATH}/.trivyignore" ]; then cat "${SERVICE_PATH}/.trivyignore" >> .trivy-combined-ignore.txt; fi
  script:
    - |
      trivy image \
        --severity HIGH,CRITICAL \
        --format json \
        --output trivy-findings.json \
        --exit-code 0 \
        --input image.tar
    - trivy version --format json > trivy-db-metadata.json || true
    - |
      trivy image \
        --format cyclonedx \
        --output sbom.cdx.json \
        --input image.tar
    - printf '%s\n' "${CI_JOB_ID}" > scan-job-id.txt
    # set +e only captures the gate's exit status; the job still exits with it.
    - |
      set +e
      trivy image \
        --severity HIGH,CRITICAL \
        --ignore-unfixed \
        --ignorefile .trivy-combined-ignore.txt \
        --exit-code 1 \
        --input image.tar
      gate_rc=$?
      set -e
      printf '%s\n' "${gate_rc}" > trivy-gate-rc.txt
      exit "${gate_rc}"
  artifacts:
    paths:
      - trivy-findings.json
      - sbom.cdx.json
      - trivy-db-metadata.json
      - trivy-gate-rc.txt
      - scan-job-id.txt
      - build-job-id.txt
    expire_in: never
    when: always
  rules:
    - changes:
        - "${SERVICE_PATH}/**/*"
        - "${SERVICE_SHARED_INPUTS}"
        - "ci/templates/image.yml"
        - "ci/templates/trivy-scan.yml"
        - "ci/templates/ecr-publish.yml"
        - "ci/templates/evidence-retain.yml"

# The same scanner, pointed at the source tree instead of the image, because ADR-0009
# requires both and neither is evidence for the other. cart's self-contained .NET publish
# and shipping's statically linked Rust binary carry no managed dependency into the image
# SBOM, so an image gate alone cannot be the dependency gate; the source pass in turn
# cannot see the operating-system layer the image pass gates. SERVICE-INVENTORY.md records
# the measured counts.
#
# The pass runs with needs: [] so it starts with the pipeline rather than after the build.
# A dependency finding does not need an image to exist, and failing before a twenty-minute
# container build is the cheaper order.
#
# SOURCE_DEPENDENCIES keeps a blind zero from reading as clean. Trivy reports nothing for a
# dependency set it cannot resolve: cart without a NuGet lock file and quote without a
# Composer lock file both returned zero findings from zero packages. A service declaring
# managed dependencies must resolve at least one package or the job fails; frontend-proxy
# (Envoy configuration) and image-provider (nginx) declare none because they have none.
#
# The package count is read with Trivy's own template output rather than jq or python,
# so the assertion needs nothing the scanner image does not already ship.
.trivy-source-scan-template:
  stage: scan
  needs: []
  image:
    name: aquasec/trivy:0.70.0@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e
    entrypoint: [""]
  variables:
    TRIVY_CACHE_DIR: .trivycache
    TRIVY_NO_PROGRESS: "true"
    SERVICE_SHARED_INPUTS: "${SERVICE_PATH}/**/*"
    SOURCE_DEPENDENCIES: declared
  cache:
    key: trivy-db-0.70.0
    paths:
      - .trivycache/
  before_script:
    - mkdir -p .trivycache
    - touch .trivy-combined-ignore.txt
    - if [ -f "${SERVICE_PATH}/.trivyignore" ]; then cat "${SERVICE_PATH}/.trivyignore" >> .trivy-combined-ignore.txt; fi
  script:
    # Pass one, informational, mirroring the image scan's order: findings are written before
    # anything can block, so a blocked pipeline still leaves triage evidence behind.
    - |
      trivy fs \
        --scanners vuln \
        --severity HIGH,CRITICAL \
        --format json \
        --output trivy-source-findings.json \
        --list-all-pkgs \
        --exit-code 0 \
        "${SERVICE_PATH}"
    - |
      resolved=$(trivy fs \
        --scanners vuln \
        --list-all-pkgs \
        --format template \
        --template '{{- range . }}{{- range .Packages }}x{{ end }}{{- end }}' \
        --exit-code 0 \
        "${SERVICE_PATH}" | tr -cd 'x' | wc -c | tr -d ' ')
      printf '%s\n' "${resolved}" > source-packages-resolved.txt
      echo "resolved ${resolved} packages, SOURCE_DEPENDENCIES=${SOURCE_DEPENDENCIES}"
      if [ "${SOURCE_DEPENDENCIES}" = "declared" ] && [ "${resolved}" -eq 0 ]; then
        echo "FAIL: ${SERVICE_NAME} declares managed dependencies and the scanner resolved none."
        echo "A zero finding count here would be a blind spot, not a clean result."
        echo "Add the ecosystem's lock file, or correct SOURCE_DEPENDENCIES if the declaration is wrong."
        exit 1
      fi
    - printf '%s\n' "${CI_JOB_ID}" > source-scan-job-id.txt
    - |
      set +e
      trivy fs \
        --scanners vuln \
        --severity HIGH,CRITICAL \
        --ignore-unfixed \
        --ignorefile .trivy-combined-ignore.txt \
        --exit-code 1 \
        "${SERVICE_PATH}"
      gate_rc=$?
      set -e
      printf '%s\n' "${gate_rc}" > trivy-source-gate-rc.txt
      exit "${gate_rc}"
  artifacts:
    paths:
      - trivy-source-findings.json
      - trivy-source-gate-rc.txt
      - source-packages-resolved.txt
      - source-scan-job-id.txt
    expire_in: never
    when: always
  rules:
    - changes:
        - "${SERVICE_PATH}/**/*"
        - "${SERVICE_SHARED_INPUTS}"
        - "ci/templates/image.yml"
        - "ci/templates/trivy-scan.yml"
        - "ci/templates/ecr-publish.yml"
        - "ci/templates/evidence-retain.yml"
