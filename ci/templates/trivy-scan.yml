# Pass one reports without failing and pass two gates, so a blocked pipeline still leaves
# findings; the SBOM is written in between for the same reason. The input is the build's tar,
# never a registry image, so nothing is published before the gate.

.trivy-scan-template:
  stage: scan
  # Pinned by digest; the cache key carries the scanner version so an upgrade gets a fresh DB.
  image:
    name: aquasec/trivy:0.70.0@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e
    entrypoint: [""]
  variables:
    TRIVY_CACHE_DIR: .trivycache
    TRIVY_NO_PROGRESS: "true"
    SERVICE_SHARED_INPUTS: "${SERVICE_PATH}/**/*"
  cache:
    key: trivy-db-0.70.0
    paths:
      - .trivycache/
  before_script:
    - mkdir -p .trivycache
    - touch .trivy-combined-ignore.txt
    - if [ -f "${SERVICE_PATH}/.trivyignore" ]; then cat "${SERVICE_PATH}/.trivyignore" >> .trivy-combined-ignore.txt; fi
  script:
    - |
      trivy image \
        --severity HIGH,CRITICAL \
        --format json \
        --output trivy-findings.json \
        --exit-code 0 \
        --input image.tar
    # Read right after pass one, so it describes the database that pass used.
    - trivy version --format json > trivy-db-metadata.json || true
    - |
      trivy image \
        --format cyclonedx \
        --output sbom.cdx.json \
        --input image.tar
    - printf '%s\n' "${CI_JOB_ID}" > scan-job-id.txt
    # set +e only records the gate's own exit status as evidence; the job still exits with it.
    - |
      set +e
      trivy image \
        --severity HIGH,CRITICAL \
        --ignore-unfixed \
        --ignorefile .trivy-combined-ignore.txt \
        --exit-code 1 \
        --input image.tar
      gate_rc=$?
      set -e
      printf '%s\n' "${gate_rc}" > trivy-gate-rc.txt
      exit "${gate_rc}"
  artifacts:
    paths:
      - trivy-findings.json
      - sbom.cdx.json
      - trivy-db-metadata.json
      - trivy-gate-rc.txt
      - scan-job-id.txt
      # Forwarded from the build: evidence jobs need the scan, not the build and its image.tar.
      - build-job-id.txt
    # Never expires: it backs the provenance of a published digest.
    expire_in: never
    when: always
  rules:
    - changes:
        - "${SERVICE_PATH}/**/*"
        - "${SERVICE_SHARED_INPUTS}"
        - "ci/templates/image.yml"
        - "ci/templates/trivy-scan.yml"
        - "ci/templates/ecr-publish.yml"
        - "ci/templates/evidence-retain.yml"

# Same scanner on the source tree: ADR-0009 requires both, and neither covers the other.
# Statically linked or self-contained binaries (shipping, cart) carry no managed dependency
# into the image SBOM, and this pass cannot see the OS layer.
.trivy-source-scan-template:
  stage: scan
  # Starts with the pipeline: a dependency finding does not need an image.
  needs: []
  image:
    name: aquasec/trivy:0.70.0@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e
    entrypoint: [""]
  variables:
    TRIVY_CACHE_DIR: .trivycache
    TRIVY_NO_PROGRESS: "true"
    SERVICE_SHARED_INPUTS: "${SERVICE_PATH}/**/*"
    # Trivy reports nothing for a dependency set it cannot resolve, which reads as clean, so a
    # service with managed dependencies must resolve at least one; services with none set none.
    SOURCE_DEPENDENCIES: declared
  cache:
    key: trivy-db-0.70.0
    paths:
      - .trivycache/
  before_script:
    - mkdir -p .trivycache
    - touch .trivy-combined-ignore.txt
    - if [ -f "${SERVICE_PATH}/.trivyignore" ]; then cat "${SERVICE_PATH}/.trivyignore" >> .trivy-combined-ignore.txt; fi
  script:
    # Informational pass first, as in the image scan, so a blocked run still leaves findings.
    - |
      trivy fs \
        --scanners vuln \
        --severity HIGH,CRITICAL \
        --format json \
        --output trivy-source-findings.json \
        --list-all-pkgs \
        --exit-code 0 \
        "${SERVICE_PATH}"
    # Counted with Trivy's own template output: the scanner image ships no jq or python.
    - |
      resolved=$(trivy fs \
        --scanners vuln \
        --list-all-pkgs \
        --format template \
        --template '{{- range . }}{{- range .Packages }}x{{ end }}{{- end }}' \
        --exit-code 0 \
        "${SERVICE_PATH}" | tr -cd 'x' | wc -c | tr -d ' ')
      printf '%s\n' "${resolved}" > source-packages-resolved.txt
      echo "resolved ${resolved} packages, SOURCE_DEPENDENCIES=${SOURCE_DEPENDENCIES}"
      if [ "${SOURCE_DEPENDENCIES}" = "declared" ] && [ "${resolved}" -eq 0 ]; then
        echo "FAIL: ${SERVICE_NAME} declares managed dependencies and the scanner resolved none."
        echo "A zero finding count here would be a blind spot, not a clean result."
        echo "Add the ecosystem's lock file, or correct SOURCE_DEPENDENCIES if the declaration is wrong."
        exit 1
      fi
    - printf '%s\n' "${CI_JOB_ID}" > source-scan-job-id.txt
    - |
      set +e
      trivy fs \
        --scanners vuln \
        --severity HIGH,CRITICAL \
        --ignore-unfixed \
        --ignorefile .trivy-combined-ignore.txt \
        --exit-code 1 \
        "${SERVICE_PATH}"
      gate_rc=$?
      set -e
      printf '%s\n' "${gate_rc}" > trivy-source-gate-rc.txt
      exit "${gate_rc}"
  artifacts:
    paths:
      - trivy-source-findings.json
      - trivy-source-gate-rc.txt
      - source-packages-resolved.txt
      - source-scan-job-id.txt
    expire_in: never
    when: always
  rules:
    - changes:
        - "${SERVICE_PATH}/**/*"
        - "${SERVICE_SHARED_INPUTS}"
        - "ci/templates/image.yml"
        - "ci/templates/trivy-scan.yml"
        - "ci/templates/ecr-publish.yml"
        - "ci/templates/evidence-retain.yml"
