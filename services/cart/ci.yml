# Declarative configuration for cart; behaviour lives in ci/templates. No publish or evidence
# job: cart has no ECR repository and none is authorized.

.cart-vars: &cart-vars
  SERVICE_NAME: cart
  SERVICE_PATH: services/cart
  LANG_TIER: dotnet
  SERVICE_DOCKERFILE: services/cart/src/Dockerfile
  # cart compiles pb/demo.proto into its gRPC stubs and COPYs pb/ into the image, so a
  # change to the shared contract changes what cart builds.
  SERVICE_SHARED_INPUTS: pb/**/*

cart:lint-dockerfile:
  extends: .hadolint-template
  variables:
    <<: *cart-vars

cart:lint-dotnet:
  extends: .lang-dotnet-template
  variables:
    <<: *cart-vars

# All three upstream tests carry [Fact(Skip = ...)], so this asserts nothing today; it stays
# wired so a change upstream is noticed.
cart:test-dotnet:
  extends: .lang-dotnet-test-template
  variables:
    <<: *cart-vars

cart:build:
  extends: .image-build-template
  variables:
    <<: *cart-vars

# Scope artifact download to this service's build job. Multi-service pipelines otherwise
# download multiple build artifacts that all use the shared image.tar filename.
cart:scan-image:
  extends: .trivy-scan-template
  dependencies:
    - cart:build
  variables:
    <<: *cart-vars

# The self-contained binary carries no managed dependency into the image SBOM, so this is
# cart's only managed-dependency scan.
cart:scan-source:
  extends: .trivy-source-scan-template
  variables:
    <<: *cart-vars

cart:health-test:
  extends: .image-health-template
  dependencies: []
  variables:
    <<: *cart-vars
    HEALTH_MODE: deferred-to-runtime
    HEALTH_REASON: >-
      Program.cs:98 resolves ValkeyCartStore before app.Run(), so Initialize() throws at
      ValkeyCartStore.cs:101 without a reachable Valkey and Kestrel never listens
