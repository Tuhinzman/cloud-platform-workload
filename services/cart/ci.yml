# Declarative configuration for cart. Behaviour lives in ci/templates.
#
# SERVICE_DOCKERFILE names the container definition because cart keeps it at src/Dockerfile
# rather than the conventional service root, which the image and hadolint templates already
# resolve through this variable.
#
# There is no health job, and the omission is measured rather than an oversight. cart
# requires VALKEY_ADDR at startup and resolves it eagerly: Program.cs:98 takes the store
# out of the container before app.Run(), so ValkeyCartStore.Initialize() runs before
# Kestrel listens. Pointed at an address that does not resolve, the process does not start
# degraded - it throws ApplicationException "Wasn't able to connect to redis" from
# EnsureRedisConnected() at cartstore/ValkeyCartStore.cs:101 and the container exits. The
# shared health template proves that a container starts and accepts a connection on its
# port, and it deliberately points services at addresses that do not resolve, so it cannot
# express what cart needs. A dependency container could be attached to this job alone, so
# the obstacle is not mechanical. It is that doing so would make cart the first component
# whose health job starts its dependencies, which is a change to what the stage means
# rather than a change to one service's configuration. That belongs to a decision about the
# health model, so the stage is recorded as a measured exception and cart's readiness is
# left to the runtime that actually has a cache.
#
# There is no publish or evidence job. Those stages need an ECR repository for cart, and no
# repository exists or is authorized. Nothing here is blocked on the pipeline.

.cart-vars: &cart-vars
  SERVICE_NAME: cart
  SERVICE_PATH: services/cart
  LANG_TIER: dotnet
  SERVICE_DOCKERFILE: services/cart/src/Dockerfile
  # cart compiles pb/demo.proto into its gRPC stubs and COPYs pb/ into the image, so a
  # change to the shared contract changes what cart builds. It is the only wired component
  # with a build job that consumes it.
  SERVICE_SHARED_INPUTS: pb/**/*

cart:lint-dockerfile:
  extends: .hadolint-template
  variables:
    <<: *cart-vars

cart:lint-dotnet:
  extends: .lang-dotnet-template
  variables:
    <<: *cart-vars

# cart ships a test project, so it opts into the test tier. All three tests in it carry
# [Fact(Skip = ...)] upstream, so the job will discover three and assert none. It is wired
# anyway because the skip is upstream state that can change, and an unwired tier would not
# notice if it did.
cart:test-dotnet:
  extends: .lang-dotnet-test-template
  variables:
    <<: *cart-vars

cart:build:
  extends: .image-build-template
  variables:
    <<: *cart-vars

# Scope artifact download to this service's build job. Multi-service pipelines otherwise
# download multiple build artifacts that all use the shared image.tar filename.
cart:scan-image:
  extends: .trivy-scan-template
  dependencies:
    - cart:build
  variables:
    <<: *cart-vars
