# Declarative configuration for checkout; behaviour lives in ci/templates. Only the ECR
# repository name is set here: the account-bearing registry host is a masked project variable.

.checkout-vars: &checkout-vars
  SERVICE_NAME: checkout
  SERVICE_PATH: services/checkout
  LANG_TIER: go

checkout:lint-dockerfile:
  extends: .hadolint-template
  variables:
    <<: *checkout-vars

checkout:lint-go:
  extends: .lang-go-template
  variables:
    <<: *checkout-vars

checkout:test-go:
  extends: .lang-go-test-template
  variables:
    <<: *checkout-vars

checkout:build:
  extends: .image-build-template
  variables:
    <<: *checkout-vars

# Scope artifact download to this service's build job. Multi-service pipelines otherwise
# download multiple build artifacts that all use the shared image.tar filename.
checkout:scan-image:
  extends: .trivy-scan-template
  dependencies:
    - checkout:build
  variables:
    <<: *checkout-vars

# Overlaps the SBOM's module graph on purpose: the binary holds what the linker kept, go.mod
# what was declared.
checkout:scan-source:
  extends: .trivy-source-scan-template
  variables:
    <<: *checkout-vars

# Dependency addresses deliberately do not resolve (gRPC connects lazily), so no other service
# is needed and this proves startup only.
checkout:health-test:
  extends: .image-health-publisher-template
  dependencies:
    - checkout:build
  variables:
    <<: *checkout-vars
    HEALTH_PORT: "8080"
    HEALTH_ENV: >-
      -e CHECKOUT_PORT=8080
      -e PRODUCT_CATALOG_ADDR=unused:8080
      -e SHIPPING_ADDR=unused:8080
      -e CART_ADDR=unused:8080
      -e CURRENCY_ADDR=unused:8080
      -e EMAIL_ADDR=unused:8080
      -e PAYMENT_ADDR=unused:8080

checkout:publish:
  extends: .ecr-publish-template
  # Both scans are required needs: GitLab refuses a pipeline that would publish unscanned.
  needs:
    - job: checkout:build
    - job: checkout:scan-image
      artifacts: false
    - job: checkout:scan-source
      artifacts: false
    - job: checkout:health-test
      artifacts: false
  variables:
    <<: *checkout-vars
    ECR_REPOSITORY: astroshop/checkout

checkout:retain-evidence:
  extends: .evidence-retain-template
  needs:
    - job: checkout:scan-image
    - job: checkout:scan-source
      artifacts: false
    - job: checkout:publish
  variables:
    <<: *checkout-vars
