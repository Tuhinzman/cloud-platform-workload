# Declarative configuration for checkout. Behaviour lives in ci/templates.
#
# checkout is the first service wired to the platform registry. Only the repository name
# is written here: the account-bearing registry host arrives as a masked project variable,
# because it identifies the AWS account.
#
# The health job points the service at addresses that do not resolve. Its gRPC clients
# connect lazily, so the container starts and serves without the rest of the fleet, and
# what the job proves stays limited to startup.

.checkout-vars: &checkout-vars
  SERVICE_NAME: checkout
  SERVICE_PATH: services/checkout
  LANG_TIER: go

checkout:lint-dockerfile:
  extends: .hadolint-template
  variables:
    <<: *checkout-vars

checkout:lint-go:
  extends: .lang-go-template
  variables:
    <<: *checkout-vars

checkout:test-go:
  extends: .lang-go-test-template
  variables:
    <<: *checkout-vars

checkout:build:
  extends: .image-build-template
  variables:
    <<: *checkout-vars

# Scope artifact download to this service's build job. Multi-service pipelines otherwise
# download multiple build artifacts that all use the shared image.tar filename.
checkout:scan-image:
  extends: .trivy-scan-template
  dependencies:
    - checkout:build
  variables:
    <<: *checkout-vars

# checkout's Go binary does carry its module graph into the image SBOM, so this pass
# overlaps rather than fills a hole. It stays because overlap is not redundancy: the
# module graph in the binary is what the linker kept, and go.mod is what was declared.
checkout:scan-source:
  extends: .trivy-source-scan-template
  variables:
    <<: *checkout-vars

checkout:health-test:
  extends: .image-health-template
  dependencies:
    - checkout:build
  variables:
    <<: *checkout-vars
    HEALTH_PORT: "8080"
    HEALTH_ENV: >-
      -e CHECKOUT_PORT=8080
      -e PRODUCT_CATALOG_ADDR=unused:8080
      -e SHIPPING_ADDR=unused:8080
      -e CART_ADDR=unused:8080
      -e CURRENCY_ADDR=unused:8080
      -e EMAIL_ADDR=unused:8080
      -e PAYMENT_ADDR=unused:8080

checkout:publish:
  extends: .ecr-publish-template
  # Both security gates are prerequisites, not ordering preferences. GitLab refuses to
  # create a pipeline whose job needs one that is not in it, so a rule change that dropped
  # either gate would fail the pipeline instead of producing a publishable image that
  # nothing scanned. The image pass and the source pass cover different things and neither
  # is evidence for the other, which is why both are named.
  needs:
    - job: checkout:build
    - job: checkout:scan-image
      artifacts: false
    - job: checkout:scan-source
      artifacts: false
  variables:
    <<: *checkout-vars
    ECR_REPOSITORY: astroshop/checkout

checkout:retain-evidence:
  extends: .evidence-retain-template
  needs:
    - job: checkout:scan-image
    - job: checkout:scan-source
      artifacts: false
    - job: checkout:publish
  variables:
    <<: *checkout-vars
