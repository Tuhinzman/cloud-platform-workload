# Declarative configuration for frontend-proxy; behaviour lives in ci/templates. Only the ECR
# repository name is set here: the account-bearing registry host is a masked project variable.
# LANG_TIER none: no application source, only a Dockerfile, a README and envoy.tmpl.yaml.

.frontend-proxy-vars: &frontend-proxy-vars
  SERVICE_NAME: frontend-proxy
  SERVICE_PATH: services/frontend-proxy
  LANG_TIER: none

frontend-proxy:lint-dockerfile:
  extends: .hadolint-template
  variables:
    <<: *frontend-proxy-vars

frontend-proxy:build:
  extends: .image-build-template
  variables:
    <<: *frontend-proxy-vars

# Scope artifact download to this service's build job. Multi-service pipelines otherwise
# download multiple build artifacts that all use the shared image.tar filename.
frontend-proxy:scan-image:
  extends: .trivy-scan-template
  dependencies:
    - frontend-proxy:build
  variables:
    <<: *frontend-proxy-vars

# Envoy configuration only: no manifest, so SOURCE_DEPENDENCIES is none.
frontend-proxy:scan-source:
  extends: .trivy-source-scan-template
  variables:
    <<: *frontend-proxy-vars
    SOURCE_DEPENDENCIES: none

# Sets every variable envoy.tmpl.yaml substitutes: envsubst blanks an unset one, and a blank
# address fails bootstrap validation (SocketAddressValidationError). Cluster hosts are STRICT_DNS
# and need not resolve, so this proves the listener starts, not that a route reaches an upstream.
frontend-proxy:health-test:
  extends: .image-health-template
  dependencies:
    - frontend-proxy:build
  variables:
    <<: *frontend-proxy-vars
    HEALTH_PORT: "8080"
    HEALTH_ENV: >-
      -e ENVOY_ADDR=0.0.0.0
      -e ENVOY_PORT=8080
      -e ENVOY_ADMIN_PORT=9901
      -e FRONTEND_HOST=frontend
      -e FRONTEND_PORT=8080
      -e IMAGE_PROVIDER_HOST=image-provider
      -e IMAGE_PROVIDER_PORT=8081
      -e FLAGD_HOST=flagd
      -e FLAGD_PORT=8013
      -e FLAGD_UI_HOST=flagd-ui
      -e FLAGD_UI_PORT=4000
      -e GRAFANA_HOST=grafana
      -e GRAFANA_PORT=3000
      -e JAEGER_HOST=jaeger
      -e JAEGER_UI_PORT=16686
      -e LOCUST_WEB_HOST=load-generator
      -e LOCUST_WEB_PORT=8089
      -e OTEL_COLLECTOR_HOST=otel-collector
      -e OTEL_COLLECTOR_PORT_GRPC=4317
      -e OTEL_COLLECTOR_PORT_HTTP=4318
      -e OTEL_SERVICE_NAME=frontend-proxy

frontend-proxy:publish:
  extends: .ecr-publish-template
  # Both scans are required needs: GitLab refuses a pipeline that would publish unscanned.
  needs:
    - job: frontend-proxy:build
    - job: frontend-proxy:scan-image
      artifacts: false
    - job: frontend-proxy:scan-source
      artifacts: false
  variables:
    <<: *frontend-proxy-vars
    ECR_REPOSITORY: astroshop/frontend-proxy

frontend-proxy:retain-evidence:
  extends: .evidence-retain-template
  needs:
    - job: frontend-proxy:scan-image
    - job: frontend-proxy:scan-source
      artifacts: false
    - job: frontend-proxy:publish
  variables:
    <<: *frontend-proxy-vars
