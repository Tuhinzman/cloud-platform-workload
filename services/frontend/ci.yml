# Declarative configuration for frontend; behaviour lives in ci/templates. Only the ECR
# repository name is set here: the account-bearing registry host is a masked project variable.

.frontend-vars: &frontend-vars
  SERVICE_NAME: frontend
  SERVICE_PATH: services/frontend
  LANG_TIER: node

frontend:lint-dockerfile:
  extends: .hadolint-template
  variables:
    <<: *frontend-vars

frontend:lint-node:
  extends: .lang-node-template
  variables:
    <<: *frontend-vars

frontend:scan-source:
  extends: .trivy-source-scan-template
  variables:
    <<: *frontend-vars

frontend:build:
  extends: .image-build-template
  variables:
    <<: *frontend-vars

frontend:scan-image:
  extends: .trivy-scan-template
  dependencies:
    - frontend:build
  variables:
    <<: *frontend-vars

# Next.js standalone reads PORT and binds HOSTNAME; without HOSTNAME it listens on the
# container hostname only and the port check cannot reach it.
frontend:health-test:
  extends: .image-health-publisher-template
  dependencies:
    - frontend:build
  variables:
    <<: *frontend-vars
    HEALTH_PORT: "8080"
    HEALTH_ENV: >-
      -e PORT=8080
      -e HOSTNAME=0.0.0.0

frontend:publish:
  extends: .ecr-publish-template
  # Both scans are required needs: GitLab refuses a pipeline that would publish unscanned.
  needs:
    - job: frontend:build
    - job: frontend:scan-image
      artifacts: false
    - job: frontend:scan-source
      artifacts: false
    - job: frontend:health-test
      artifacts: false
  variables:
    <<: *frontend-vars
    ECR_REPOSITORY: astroshop/frontend

frontend:retain-evidence:
  extends: .evidence-retain-template
  needs:
    - job: frontend:scan-image
    - job: frontend:scan-source
      artifacts: false
    - job: frontend:publish
  variables:
    <<: *frontend-vars
