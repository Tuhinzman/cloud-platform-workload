# Declarative configuration for frontend. Behaviour lives in ci/templates.
#
# IMAGE_REPO is deliberately absent. The platform registry exists, but frontend has no
# repository in it and no publish path, so the image jobs stay unwired rather than
# pointing somewhere wrong.

.frontend-vars: &frontend-vars
  SERVICE_NAME: frontend
  SERVICE_PATH: services/frontend
  LANG_TIER: node

frontend:lint-dockerfile:
  extends: .hadolint-template
  variables:
    <<: *frontend-vars

frontend:lint-node:
  extends: .lang-node-template
  variables:
    <<: *frontend-vars
