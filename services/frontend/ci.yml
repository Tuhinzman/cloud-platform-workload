# Declarative configuration for frontend. Behaviour lives in ci/templates.
#
# IMAGE_REPO is deliberately absent. It resolves to the platform registry, and that
# coordinate does not exist yet, so the scan job stays inactive rather than pointing
# somewhere wrong.

.frontend-vars: &frontend-vars
  SERVICE_NAME: frontend
  SERVICE_PATH: services/frontend
  LANG_TIER: node

frontend:lint-dockerfile:
  extends: .hadolint-template
  variables:
    <<: *frontend-vars

frontend:lint-node:
  extends: .lang-node-template
  variables:
    <<: *frontend-vars
