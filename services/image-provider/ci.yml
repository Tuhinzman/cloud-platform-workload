# Declarative configuration for image-provider; behaviour lives in ci/templates. Only the ECR
# repository name is set here: the account-bearing registry host is a masked project variable.
# LANG_TIER none: no application source, only a Dockerfile, nginx.conf.template and static files.

.image-provider-vars: &image-provider-vars
  SERVICE_NAME: image-provider
  SERVICE_PATH: services/image-provider
  LANG_TIER: none

image-provider:lint-dockerfile:
  extends: .hadolint-template
  variables:
    <<: *image-provider-vars

image-provider:build:
  extends: .image-build-template
  variables:
    <<: *image-provider-vars

# Scope artifact download to this service's build job. Multi-service pipelines otherwise
# download multiple build artifacts that all use the shared image.tar filename.
image-provider:scan-image:
  extends: .trivy-scan-template
  dependencies:
    - image-provider:build
  variables:
    <<: *image-provider-vars

# An nginx image with static assets: no manifest, so SOURCE_DEPENDENCIES is none.
image-provider:scan-source:
  extends: .trivy-source-scan-template
  variables:
    <<: *image-provider-vars
    SOURCE_DEPENDENCIES: none

# Sets exactly the four variables the Dockerfile's envsubst names. The resolver is a literal in
# the template and the OTEL endpoint resolves only at export, so nginx starts without a collector.
image-provider:health-test:
  extends: .image-health-template
  dependencies:
    - image-provider:build
  variables:
    <<: *image-provider-vars
    HEALTH_PORT: "8081"
    HEALTH_ENV: >-
      -e IMAGE_PROVIDER_PORT=8081
      -e OTEL_COLLECTOR_HOST=otel-collector
      -e OTEL_COLLECTOR_PORT_GRPC=4317
      -e OTEL_SERVICE_NAME=image-provider

image-provider:publish:
  extends: .ecr-publish-template
  # Both scans are required needs: GitLab refuses a pipeline that would publish unscanned.
  needs:
    - job: image-provider:build
    - job: image-provider:scan-image
      artifacts: false
    - job: image-provider:scan-source
      artifacts: false
  variables:
    <<: *image-provider-vars
    ECR_REPOSITORY: astroshop/image-provider

image-provider:retain-evidence:
  extends: .evidence-retain-template
  needs:
    - job: image-provider:scan-image
    - job: image-provider:scan-source
      artifacts: false
    - job: image-provider:publish
  variables:
    <<: *image-provider-vars
