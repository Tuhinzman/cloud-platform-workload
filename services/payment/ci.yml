# Declarative configuration for payment; behaviour lives in ci/templates. Only the ECR
# repository name is set here: the account-bearing registry host is a masked project variable.

.payment-vars: &payment-vars
  SERVICE_NAME: payment
  SERVICE_PATH: services/payment
  LANG_TIER: node
  # payment COPYs pb/demo.proto into its image and loads it at startup, so a change to the
  # shared contract changes what payment builds and what it serves.
  SERVICE_SHARED_INPUTS: pb/**/*

payment:lint-dockerfile:
  extends: .hadolint-template
  variables:
    <<: *payment-vars

# Plain JavaScript with no linter, so it extends the parse check, which asserts only that
# every .js file parses: nothing a linter would report.
payment:lint-node:
  extends: .lang-node-parse-template
  variables:
    <<: *payment-vars

payment:scan-source:
  extends: .trivy-source-scan-template
  variables:
    <<: *payment-vars

payment:build:
  extends: .image-build-template
  variables:
    <<: *payment-vars

# Scope artifact download to this service's build job. Multi-service pipelines otherwise
# download multiple build artifacts that all use the shared image.tar filename.
payment:scan-image:
  extends: .trivy-scan-template
  dependencies:
    - payment:build
  variables:
    <<: *payment-vars

# payment binds its port before needing anything external; flagd is reached only per Charge
# request, so no dependency container is needed.
payment:health-test:
  extends: .image-health-publisher-template
  dependencies:
    - payment:build
  variables:
    <<: *payment-vars
    HEALTH_PORT: "8080"
    HEALTH_ENV: >-
      -e PAYMENT_PORT=8080

payment:publish:
  extends: .ecr-publish-template
  # Both scans are required needs: GitLab refuses a pipeline that would publish unscanned.
  needs:
    - job: payment:build
    - job: payment:scan-image
      artifacts: false
    - job: payment:scan-source
      artifacts: false
    - job: payment:health-test
      artifacts: false
  variables:
    <<: *payment-vars
    ECR_REPOSITORY: astroshop/payment

payment:retain-evidence:
  extends: .evidence-retain-template
  needs:
    - job: payment:scan-image
    - job: payment:scan-source
      artifacts: false
    - job: payment:publish
  variables:
    <<: *payment-vars
