# Declarative configuration for payment. Behaviour lives in ci/templates.
#
# IMAGE_REPO is deliberately absent. It resolves to the platform registry, and that
# coordinate does not exist yet, so the scan job stays inactive rather than pointing
# somewhere wrong.

.payment-vars: &payment-vars
  SERVICE_NAME: payment
  SERVICE_PATH: services/payment
  LANG_TIER: node

.adolint:
  extends: .hadolint-template
  variables:
    <<: *payment-vars

# Non-blocking, not ignored: the job still runs and still reports its findings. Those
# findings are pre-existing and outside Phase 6 Slice 3, and remediating them remains
# required when this service is wired. The setting exists only so unrelated service debt
# does not prevent checkout first-digest validation.
payment:lint-node:
  extends: .lang-node-template
  allow_failure: true
  variables:
    <<: *payment-vars
