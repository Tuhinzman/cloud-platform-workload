# Declarative configuration for payment. Behaviour lives in ci/templates.
#
# IMAGE_REPO is deliberately absent. It resolves to the platform registry, and that
# coordinate does not exist yet, so the scan job stays inactive rather than pointing
# somewhere wrong.

.payment-vars: &payment-vars
  SERVICE_NAME: payment
  SERVICE_PATH: services/payment
  LANG_TIER: node

payment:lint-dockerfile:
  extends: .hadolint-template
  variables:
    <<: *payment-vars

# payment is plain JavaScript and declares no linter, so it extends the parse template
# rather than the lint and type-check one. What a passing result asserts is narrow: every
# JavaScript file in the service directory parses. It says nothing about undefined
# identifiers, unused bindings, or anything else a linter reports.
#
# Non-blocking until the first run of the corrected job has been measured.
payment:lint-node:
  extends: .lang-node-parse-template
  allow_failure: true
  variables:
    <<: *payment-vars
