# Declarative configuration for quote. Behaviour lives in ci/templates.
#
# Only the repository name is written here: the account-bearing registry host arrives as a
# masked project variable, because it identifies the AWS account.
#
# There is no test job, and that is a statement about the service rather than an omission
# in this file. quote declares no require-dev section in composer.json, carries no test
# runner, no test configuration and no test directory, so no automated test exists to run.
# A test job here would extend a tier that asserted nothing. The lint tier's parse check is
# the only automated evidence this service currently produces about its own source.
#
# The health job sets QUOTE_PORT and nothing else. public/index.php:100 builds the listen
# address from it, so the socket cannot open without it. It is also the only variable the
# service requires: the whole of app/, public/ and src/ reads exactly two environment
# variables, and the other, IPV6_ENABLED at public/index.php:93, is optional and leaves the
# bind at 0.0.0.0, which is the address the health check connects to.
#
# quote calls no other service. Its one route computes a quote arithmetically at
# app/routes.php:29-30, so unlike checkout this health job needs no placeholder addresses
# for absent fleet members.

.quote-vars: &quote-vars
  SERVICE_NAME: quote
  SERVICE_PATH: services/quote
  LANG_TIER: php

quote:lint-dockerfile:
  extends: .hadolint-template
  variables:
    <<: *quote-vars

quote:lint-php:
  extends: .lang-php-template
  variables:
    <<: *quote-vars

quote:build:
  extends: .image-build-template
  variables:
    <<: *quote-vars

# Scope artifact download to this service's build job. Multi-service pipelines otherwise
# download multiple build artifacts that all use the shared image.tar filename.
quote:scan-image:
  extends: .trivy-scan-template
  dependencies:
    - quote:build
  variables:
    <<: *quote-vars

quote:health-test:
  extends: .image-health-template
  dependencies:
    - quote:build
  variables:
    <<: *quote-vars
    HEALTH_PORT: "8080"
    HEALTH_ENV: >-
      -e QUOTE_PORT=8080

quote:publish:
  extends: .ecr-publish-template
  # The scan is a prerequisite, not an ordering preference. GitLab refuses to create a
  # pipeline whose job needs one that is not in it, so a rule change that dropped the gate
  # would fail the pipeline instead of producing a publishable image that nothing scanned.
  needs:
    - job: quote:build
    - job: quote:scan-image
      artifacts: false
  variables:
    <<: *quote-vars
    ECR_REPOSITORY: astroshop/quote

quote:retain-evidence:
  extends: .evidence-retain-template
  needs:
    - job: quote:scan-image
    - job: quote:publish
  variables:
    <<: *quote-vars
