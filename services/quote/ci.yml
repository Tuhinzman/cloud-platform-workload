# Declarative configuration for quote. Behaviour lives in ci/templates.
#
# Only the repository name is written here: the account-bearing registry host arrives as a
# masked project variable, because it identifies the AWS account.
#
# No test job: quote has no require-dev section in composer.json, no test runner, test
# configuration or test directory, so a test job would assert nothing. The lint tier's
# parse check is the only automated evidence about its own source.
#
# The health job sets only QUOTE_PORT, which public/index.php:100 needs to build the listen
# address. The only other variable app/, public/ and src/ read is IPV6_ENABLED
# (public/index.php:93), which is optional; unset, the bind stays 0.0.0.0, the address the
# health check connects to. quote calls no other service: its one route computes
# arithmetically (app/routes.php:29-30), so no placeholder addresses are needed.

.quote-vars: &quote-vars
  SERVICE_NAME: quote
  SERVICE_PATH: services/quote
  LANG_TIER: php

quote:lint-dockerfile:
  extends: .hadolint-template
  variables:
    <<: *quote-vars

quote:lint-php:
  extends: .lang-php-template
  variables:
    <<: *quote-vars

quote:build:
  extends: .image-build-template
  variables:
    <<: *quote-vars

# Scope artifact download to this service's build job. Multi-service pipelines otherwise
# download multiple build artifacts that all use the shared image.tar filename.
quote:scan-image:
  extends: .trivy-scan-template
  dependencies:
    - quote:build
  variables:
    <<: *quote-vars

# quote's vendor directory reaches the image, so the image scan already sees its
# Composer packages. This pass reads composer.lock instead, which is the resolution
# the build was pinned to rather than the tree that happened to be produced.
quote:scan-source:
  extends: .trivy-source-scan-template
  variables:
    <<: *quote-vars

quote:health-test:
  extends: .image-health-template
  dependencies:
    - quote:build
  variables:
    <<: *quote-vars
    HEALTH_PORT: "8080"
    HEALTH_ENV: >-
      -e QUOTE_PORT=8080

quote:publish:
  extends: .ecr-publish-template
  # Both scan gates are mandatory needs, and neither is evidence for the other: GitLab
  # refuses a pipeline missing either one instead of offering an unscanned publish.
  # Rationale: ci/templates/ecr-publish.yml and ci/templates/trivy-scan.yml.
  needs:
    - job: quote:build
    - job: quote:scan-image
      artifacts: false
    - job: quote:scan-source
      artifacts: false
  variables:
    <<: *quote-vars
    ECR_REPOSITORY: astroshop/quote

quote:retain-evidence:
  extends: .evidence-retain-template
  needs:
    - job: quote:scan-image
    - job: quote:scan-source
      artifacts: false
    - job: quote:publish
  variables:
    <<: *quote-vars
