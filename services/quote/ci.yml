# Declarative configuration for quote; behaviour lives in ci/templates. Only the ECR
# repository name is set here: the account-bearing registry host is a masked project variable.
# No test job: quote has no require-dev, test runner or tests, so the lint tier's parse check is
# the only automated evidence about its own code.

.quote-vars: &quote-vars
  SERVICE_NAME: quote
  SERVICE_PATH: services/quote
  LANG_TIER: php

quote:lint-dockerfile:
  extends: .hadolint-template
  variables:
    <<: *quote-vars

quote:lint-php:
  extends: .lang-php-template
  variables:
    <<: *quote-vars

quote:build:
  extends: .image-build-template
  variables:
    <<: *quote-vars

# Scope artifact download to this service's build job. Multi-service pipelines otherwise
# download multiple build artifacts that all use the shared image.tar filename.
quote:scan-image:
  extends: .trivy-scan-template
  dependencies:
    - quote:build
  variables:
    <<: *quote-vars

# The image scan sees vendor/; this pass reads composer.lock, the resolution the build pinned.
quote:scan-source:
  extends: .trivy-source-scan-template
  variables:
    <<: *quote-vars

# Sets only QUOTE_PORT (public/index.php:100). IPV6_ENABLED is optional and unset binds
# 0.0.0.0; quote calls no other service, so no placeholder addresses are needed.
quote:health-test:
  extends: .image-health-template
  dependencies:
    - quote:build
  variables:
    <<: *quote-vars
    HEALTH_PORT: "8080"
    HEALTH_ENV: >-
      -e QUOTE_PORT=8080

quote:publish:
  extends: .ecr-publish-template
  # Both scans are required needs: GitLab refuses a pipeline that would publish unscanned.
  needs:
    - job: quote:build
    - job: quote:scan-image
      artifacts: false
    - job: quote:scan-source
      artifacts: false
  variables:
    <<: *quote-vars
    ECR_REPOSITORY: astroshop/quote

quote:retain-evidence:
  extends: .evidence-retain-template
  needs:
    - job: quote:scan-image
    - job: quote:scan-source
      artifacts: false
    - job: quote:publish
  variables:
    <<: *quote-vars
