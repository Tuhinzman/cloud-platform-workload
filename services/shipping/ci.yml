# Declarative configuration for shipping; behaviour lives in ci/templates. Only the ECR
# repository name is set here: the account-bearing registry host is a masked project variable.

.shipping-vars: &shipping-vars
  SERVICE_NAME: shipping
  SERVICE_PATH: services/shipping
  LANG_TIER: rust

shipping:lint-dockerfile:
  extends: .hadolint-template
  variables:
    <<: *shipping-vars

shipping:lint-rust:
  extends: .lang-rust-template
  variables:
    <<: *shipping-vars

# Unit tests cover pure quote formatting (src/shipping_service/quote.rs:99, :114) plus an
# in-process handler test (src/shipping_service.rs:64); none needs network or a sibling service.
shipping:test-rust:
  extends: .lang-rust-test-template
  variables:
    <<: *shipping-vars

shipping:build:
  extends: .image-build-template
  variables:
    <<: *shipping-vars

# Scope artifact download to this service's build job. Multi-service pipelines otherwise
# download multiple build artifacts that all use the shared image.tar filename.
shipping:scan-image:
  extends: .trivy-scan-template
  dependencies:
    - shipping:build
  variables:
    <<: *shipping-vars

# Rust links crates statically, so the image SBOM has none; this is shipping's only
# managed-dependency scan.
shipping:scan-source:
  extends: .trivy-source-scan-template
  variables:
    <<: *shipping-vars

# Sets only SHIPPING_PORT (src/main.rs:25 panics without it). QUOTE_ADDR is read per /get-quote
# request and has a default, so it stays unset: this job does not exercise quote. IPV6_ENABLED
# is optional; unset, the bind is 0.0.0.0, which the check connects to.
shipping:health-test:
  extends: .image-health-publisher-template
  dependencies:
    - shipping:build
  variables:
    <<: *shipping-vars
    HEALTH_PORT: "8080"
    HEALTH_ENV: >-
      -e SHIPPING_PORT=8080

shipping:publish:
  extends: .ecr-publish-template
  # Both scans are required needs: GitLab refuses a pipeline that would publish unscanned.
  needs:
    - job: shipping:build
    - job: shipping:scan-image
      artifacts: false
    - job: shipping:scan-source
      artifacts: false
    - job: shipping:health-test
      artifacts: false
  variables:
    <<: *shipping-vars
    ECR_REPOSITORY: astroshop/shipping

shipping:retain-evidence:
  extends: .evidence-retain-template
  needs:
    - job: shipping:scan-image
    - job: shipping:scan-source
      artifacts: false
    - job: shipping:publish
  variables:
    <<: *shipping-vars
