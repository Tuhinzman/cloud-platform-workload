# Declarative configuration for shipping. Behaviour lives in ci/templates.
#
# Only the repository name is written here: the account-bearing registry host arrives as a
# masked project variable, because it identifies the AWS account.
#
# The health job sets only SHIPPING_PORT; src/main.rs:25 reads it with .expect() and
# panics without it. QUOTE_ADDR is read only per /get-quote request
# (src/shipping_service/quote.rs:43) and has a default, so it stays unset rather than
# implying this job exercises the quote dependency. IPV6_ENABLED is optional
# (src/main.rs:32); unset, the bind is 0.0.0.0, the address the health check connects to.

.shipping-vars: &shipping-vars
  SERVICE_NAME: shipping
  SERVICE_PATH: services/shipping
  LANG_TIER: rust

shipping:lint-dockerfile:
  extends: .hadolint-template
  variables:
    <<: *shipping-vars

shipping:lint-rust:
  extends: .lang-rust-template
  variables:
    <<: *shipping-vars

# shipping owns unit tests, so it opts into the test tier. They are pure functions over
# quote formatting at src/shipping_service/quote.rs:99 and :114, plus the module at
# src/shipping_service.rs:64. They require no network and no sibling service.
shipping:test-rust:
  extends: .lang-rust-test-template
  variables:
    <<: *shipping-vars

shipping:build:
  extends: .image-build-template
  variables:
    <<: *shipping-vars

# Scope artifact download to this service's build job. Multi-service pipelines otherwise
# download multiple build artifacts that all use the shared image.tar filename.
shipping:scan-image:
  extends: .trivy-scan-template
  dependencies:
    - shipping:build
  variables:
    <<: *shipping-vars

# shipping links its Rust dependencies statically, so its image SBOM carries 14
# operating-system packages and no crate. This pass is the only managed-dependency
# coverage shipping has.
shipping:scan-source:
  extends: .trivy-source-scan-template
  variables:
    <<: *shipping-vars

shipping:health-test:
  extends: .image-health-template
  dependencies:
    - shipping:build
  variables:
    <<: *shipping-vars
    HEALTH_PORT: "8080"
    HEALTH_ENV: >-
      -e SHIPPING_PORT=8080

shipping:publish:
  extends: .ecr-publish-template
  # Both scan gates are mandatory needs, and neither is evidence for the other: GitLab
  # refuses a pipeline missing either one instead of offering an unscanned publish.
  # Rationale: ci/templates/ecr-publish.yml and ci/templates/trivy-scan.yml.
  needs:
    - job: shipping:build
    - job: shipping:scan-image
      artifacts: false
    - job: shipping:scan-source
      artifacts: false
  variables:
    <<: *shipping-vars
    ECR_REPOSITORY: astroshop/shipping

shipping:retain-evidence:
  extends: .evidence-retain-template
  needs:
    - job: shipping:scan-image
    - job: shipping:scan-source
      artifacts: false
    - job: shipping:publish
  variables:
    <<: *shipping-vars
